<svg xmlns="http://www.w3.org/2000/svg" width="760" height="704" viewBox="0 0 760 704" role="img" aria-label="Technology Readiness Level ladder. Current level: TRL 1, Basic research.">
<title>Agrythm Connect: current Technology Readiness Level is TRL 1 (Basic research)</title>
<style>
  text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
  .row   { animation: slide .55s ease-out both; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  .arrow { animation: nudge 1.1s ease-in-out infinite; }
  .badge { animation: blink 1.6s ease-in-out infinite; }
  @keyframes slide { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .row, .pulse, .arrow, .badge { animation: none; } }
</style>
<rect x="1" y="1" width="758" height="702" rx="16" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="2"/>
<text x="32" y="44" font-size="24" font-weight="700" fill="#1F2933">Agrythm Connect: Technology Readiness Level</text>
<text x="32" y="72" font-size="15" fill="#4B5563">Current: <tspan font-weight="700" fill="#1F2933">TRL 1 (Basic research)</tspan></text>
